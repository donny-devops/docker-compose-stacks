# Optional local hooks mirroring the CI linters (yamllint, actionlint, gitleaks).
# Enable with:  pipx install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -d
          - "{extends: relaxed, rules: {line-length: {max: 200}}}"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
