name: Image Vulnerability Scan

on:
  push:
    branches: [main]
    paths: ['**/docker-compose.yml']
  pull_request:
    branches: [main]
    paths: ['**/docker-compose.yml']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-images:
    name: Collect compose images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image matrix from compose files
        id: list
        run: |
          images=$(grep -rhoE '^[[:space:]]*image:[[:space:]]*\S+' ./*/docker-compose.yml \
            | sed -E 's/^[[:space:]]*image:[[:space:]]*//' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Discovered images: $images"

  trivy-image:
    name: Trivy image scan
    needs: collect-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.collect-images.outputs.images) }}
    steps:
      # Informational (non-blocking): upstream image CVEs surface in the
      # Security tab, one code-scanning category per image.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Derive SARIF category
        id: cat
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=$(echo "$IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ steps.cat.outputs.name }}
