name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      # Enforces a Conventional Commits PR title so release-please can infer
      # SemVer bumps from squash-merged PRs. Reads the title from the event
      # payload (no checkout), so plain `pull_request` + read is sufficient.
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            build
            perf
            refactor
            revert
            style
            test
