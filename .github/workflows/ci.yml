name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          find . -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}"

  validate-stacks:
    name: Validate Docker Compose stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - homelab-dashboard
          - monitoring-analytics
    steps:
      - uses: actions/checkout@v4

      - name: Validate ${{ matrix.stack }} compose file
        working-directory: ${{ matrix.stack }}
        run: docker compose config --quiet

  trivy-scan:
    name: Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
