name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all YAML files
        run: |
          find . -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' -not -path '*/node_modules/*' -print0 \
            | xargs -0 yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}"

  validate-stacks:
    name: Validate Docker Compose stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - homelab-dashboard
          - monitoring-analytics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate ${{ matrix.stack }} compose file
        working-directory: ${{ matrix.stack }}
        run: docker compose config --quiet

  smoke-test:
    name: Smoke test ${{ matrix.stack }}
    needs: validate-stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A reliable core subset per stack: config-file mounts only, no host
          # mount-propagation or privileged services, deterministic health URLs.
          - stack: monitoring-analytics
            services: prometheus alertmanager
            url: http://localhost:9090/-/healthy
          - stack: homelab-dashboard
            services: uptime-kuma
            url: http://localhost:3001/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Seed .env
        working-directory: ${{ matrix.stack }}
        run: cp .env.example .env

      - name: Bring up core subset
        working-directory: ${{ matrix.stack }}
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          read -ra svc <<< "$SERVICES"
          docker compose up -d "${svc[@]}"

      - name: Wait for health endpoint
        env:
          URL: ${{ matrix.url }}
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "$URL responded HTTP $code after attempt $i"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying..."
            sleep 3
          done
          echo "service did not become healthy in time"
          exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: ${{ matrix.stack }}
        run: docker compose logs --no-color --tail 100

      - name: Tear down
        if: always()
        working-directory: ${{ matrix.stack }}
        run: docker compose down -v

  trivy-scan:
    name: Trivy config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-config.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
