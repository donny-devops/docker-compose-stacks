name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Triage stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mark and close stale items
        uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e # v9.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,dependencies
          exempt-pr-labels: pinned,security,dependencies
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked stale.
            Remove the stale label or comment to keep it open, otherwise it
            will be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 60 days and is now marked
            stale. Push a commit or comment to keep it open, otherwise it will
            be closed in 14 days.
          close-issue-message: >
            Closing this issue after 14 additional days of inactivity. Comment
            to reopen if it is still relevant.
          close-pr-message: >
            Closing this pull request after 14 additional days of inactivity.
            Feel free to reopen when you can continue the work.
