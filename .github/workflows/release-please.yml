name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Maintains a release PR, bumps the version, updates CHANGELOG.md, and
      # tags + creates a GitHub Release on merge. Uses conventional commits.
      - name: Run release-please
        uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
