name: KICS Code Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  kics:
    name: Scan Docker Compose for misconfigurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Informational (non-blocking), matching the repo's Trivy config scan.
      - name: Run KICS
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" \
            checkmarx/kics:latest scan -p /path -t DockerCompose \
            -o /path --report-formats sarif \
            --no-progress --no-color || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          sarif_file: results.sarif
          category: kics
